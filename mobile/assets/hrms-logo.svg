<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HRMS"
     color-interpolation-filters="sRGB">

  <title>HRMS</title>

  <!--
    The HRMS lockup: "HRM" in a white serif, with the gold zigzag mark standing
    in for the S. The mark is taller than the cap height on purpose — it
    overshoots above and below the letters, which is what stops it reading as a
    fourth letter and makes it read as a device.

    Laid out on a 512 square because the app icon is the demanding case. The
    banner crop (a tight viewBox around the lockup) is taken from this same
    artwork at build time — see the icon generator.
  -->

  <defs>
    <!-- Near-black tile with a faint lift so it doesn't read as dead flat -->
    <radialGradient id="bg" cx="40%" cy="32%" r="86%">
      <stop offset="0"    stop-color="#131211"/>
      <stop offset="0.55" stop-color="#070706"/>
      <stop offset="1"    stop-color="#000000"/>
    </radialGradient>

    <!-- Built around the reference gold #DAB66C. userSpaceOnUse coordinates are
         the MARK's own, before it is placed — so the gradient runs along the
         zigzag rather than across the whole canvas. -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="150" y1="55" x2="360" y2="455">
      <stop offset="0"    stop-color="#F6E3B4"/>
      <stop offset="0.24" stop-color="#E6C98A"/>
      <stop offset="0.50" stop-color="#DAB66C"/>
      <stop offset="0.78" stop-color="#C39A4C"/>
      <stop offset="1"    stop-color="#A87E33"/>
    </linearGradient>

    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="150" y1="40" x2="300" y2="300">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!--
      The mark is a zigzag stroke + arrowhead, CLIPPED to a vertical strip.
      That clip is what produces the flat vertical faces at the tail, the left
      chevron and the right point — they are not mitred joins, they are cut off
      square. Visible bounds after clipping: x 147.5-364.7, y 60.5-451.5.
    -->
    <clipPath id="strip">
      <rect x="147.5" y="0" width="217.2" height="512"/>
    </clipPath>

    <g id="mark" clip-path="url(#strip)">
      <!-- centreline: tail -> right vertex -> left vertex -> arrow base -->
      <path d="M87.3 460.4 L364.7 324.5 L106.5 198.0 L327.5 89.7"
            fill="none" stroke-width="37" stroke-linejoin="miter" stroke-miterlimit="12"/>
      <!-- arrowhead: base corners, barbs, tip -->
      <path d="M319.4 73.1 L318.8 60.5 L364.7 71.5 L345.2 114.5 L335.6 106.3 Z"
            stroke="none"/>
    </g>
  </defs>

  <!-- 1. Tile  (the icon generator drops this rect for the transparent variants) -->
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>

  <!-- 2. "HRM", white serif, sitting on the left of the lockup -->
  <text x="42.6" y="302.3" textLength="319" lengthAdjust="spacingAndGlyphs"
        font-family="'Playfair Display','Didot','Bodoni MT','Bodoni 72',Georgia,'Times New Roman',serif"
        font-size="140" font-weight="500" text-anchor="start"
        fill="#FFFFFF">HRM</text>

  <!-- 3. The gold mark as the S: scaled to 0.4066 and set just right of the M.
          Nudged 9px above the letters' own midline — in the reference the mark
          overshoots the cap height more than it drops below the baseline, and
          centring it exactly makes the lockup sit low. -->
  <g transform="translate(321.03,142.9) scale(0.4066)">
    <use xlink:href="#mark" href="#mark" fill="url(#gold)" stroke="url(#gold)"/>
    <use xlink:href="#mark" href="#mark" fill="url(#sheen)" stroke="url(#sheen)"/>
  </g>
</svg>
